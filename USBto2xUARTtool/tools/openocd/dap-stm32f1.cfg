# OpenOCD configuration for this board:
#   probe  : DAPLink (USB VID 0x0D28 / PID 0x0204), CMSIS-DAP firmware 0253
#   target : STM32F103C8/CB (64 KB flash part, Cortex-M3)
#   link   : SWD, 1 MHz, target powered by the board itself
#
# Use it as: openocd -f tools/openocd/dap-stm32f1.cfg -c "init" -c "halt" -c "shutdown"
#
# MEASURED ON THIS MACHINE: the probe answers on the CMSIS-DAP **HID** backend
# only.  With the WinUSB "bulk" backend OpenOCD reports
#   Error: unable to find a matching CMSIS-DAP device
# while HID connects immediately (DPIDR 0x1ba01477, Cortex-M3 r1p1).  Both the
# 0.11 sysprogs build and the 0.12 Espressif build work this way; the command was
# renamed in 0.12 ('cmsis_dap_backend' -> 'cmsis-dap backend'), so tools\flash.ps1
# writes the correct spelling for the version it found.

source [find interface/cmsis-dap.cfg]

cmsis_dap_backend hid
transport select swd

# 1 MHz is rock solid on a 10 cm ribbon; raise to 2000 if the wiring is short.
adapter speed 1000

# Only SYSRESETREQ is available in practice: the DAPLink's nRESET is read as 1
# and never pulls the target's reset low, so ask for no SRST handling.
reset_config none

source [find target/stm32f1x.cfg]
